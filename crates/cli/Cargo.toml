[package]
name = "landform_cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "landform"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
landform_core = { path = "../core" }
png = "0.18.1"
proj4rs = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"
toml = "1.2.1"
